name: struk-jadi-saham

# Satu perintah untuk juri:  docker compose up --build  →  http://127.0.0.1:3000
# Mode offline: semua data dari snapshot Sectors asli di fixtures/snapshot (0 kredit).
# Paham Emiten tidak memakai LLM. OPENROUTER_API_KEY (opsional) hanya untuk halaman lama /idxmaca (ditutup di demo publik).

services:
  store:
    build:
      context: .
      dockerfile: apps/store/Dockerfile
    restart: unless-stopped
    environment:
      IDXMACA_STORE_MODE: ${IDXMACA_STORE_MODE:-offline}
      SECTORS_API_KEY: ${SECTORS_API_KEY:-}
      SECTORS_BASE_URL: ${SECTORS_BASE_URL:-https://api.sectors.app}
      IDXMACA_DATA_DIR: /data
    volumes:
      - struk-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8787/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  core:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    restart: unless-stopped
    environment:
      IDXMACA_STORE_URL: http://store:8787
      IDXMACA_LLM_MODE: ${IDXMACA_LLM_MODE:-auto}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      IDXMACA_MODEL: ${IDXMACA_MODEL:-google/gemini-3.8-flash}
      STRUK_SECTORS_OFF: ${STRUK_SECTORS_OFF:-0}
      IDXMACA_DATA_DIR: /data
    volumes:
      - struk-data:/data
    depends_on:
      store:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8788/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      CORE_URL: http://core:8788
      PUBLIC_DEMO: ${PUBLIC_DEMO:-0}
    ports:
      - "${WEB_BIND:-127.0.0.1:3000}:3000"
    depends_on:
      core:
        condition: service_healthy

volumes:
  struk-data:
