name: idxmaca

services:
  store:
    build:
      context: .
      dockerfile: apps/store/Dockerfile
    environment:
      IDXMACA_STORE_MODE: ${IDXMACA_STORE_MODE:-fixture}
      SECTORS_API_KEY: ${SECTORS_API_KEY:-}
      SECTORS_BASE_URL: ${SECTORS_BASE_URL:-https://api.sectors.app}
      IDXMACA_ALLOW_FIXTURE_FALLBACK: ${IDXMACA_ALLOW_FIXTURE_FALLBACK:-1}
      IDXMACA_DATA_DIR: /data
    volumes:
      - idxmaca-data:/data
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8787/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  core:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    environment:
      IDXMACA_STORE_URL: http://store:8787
      IDXMACA_LLM_MODE: ${IDXMACA_LLM_MODE:-auto}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      IDXMACA_MODEL: ${IDXMACA_MODEL:-meta/muse-spark-1.3}
      IDXMACA_MAX_CREDITS_PER_RUN: ${IDXMACA_MAX_CREDITS_PER_RUN:-60}
      IDXMACA_DATA_DIR: /data
    volumes:
      - idxmaca-data:/data
    ports:
      - "8788:8788"
    depends_on:
      store:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      CORE_URL: http://core:8788
    ports:
      - "3000:3000"
    depends_on:
      - core

volumes:
  idxmaca-data: